
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grade Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>📚 Student Grade Calculator</h1>
        <p>Enter your marks in 5 subjects.</p>

        <div class="input-group">
            <label for="sub1">Subject 1</label>
            <input type="number" id="sub1" placeholder="Marks out of 100" min="0" max="100">
        </div>

        <div class="input-group">
            <label for="sub2">Subject 2</label>
            <input type="number" id="sub2" placeholder="Marks out of 100" min="0" max="100">
        </div>

        <div class="input-group">
            <label for="sub3">Subject 3</label>
            <input type="number" id="sub3" placeholder="Marks out of 100" min="0" max="100">
        </div>

        <div class="input-group">
            <label for="sub4">Subject 4</label>
            <input type="number" id="sub4" placeholder="Marks out of 100" min="0" max="100">
        </div>

        <div class="input-group">
            <label for="sub5">Subject 5</label>
            <input type="number" id="sub5" placeholder="Marks out of 100" min="0" max="100">
        </div>

        <button onclick="calculateGrade()">Calculate Result</button>
        <button class="reset-btn" onclick="resetForm()">Reset</button>

        <div id="result" aria-live="polite"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
